name: Build Delogo App

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Choose Target OS to Build'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - macos-latest
          - both
      version_tag:
        description: 'Release Version (e.g. v1.0.0). Leave empty to test build without publishing.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event.inputs.target_os }}" == "both" ]; then
            echo "matrix=[\"windows-latest\", \"macos-latest\"]" >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"${{ github.event.inputs.target_os }}\"]" >> $GITHUB_OUTPUT
          fi

  build:
    needs: setup
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set Package Version
      if: ${{ github.event.inputs.version_tag != '' }}
      shell: bash
      working-directory: ./frontend
      run: |
        VERSION_NO_V=$(echo "${{ github.event.inputs.version_tag }}" | sed 's/^v//')
        npm version $VERSION_NO_V --no-git-tag-version --allow-same-version

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r backend/requirements.txt

    - name: Download Lama Model
      shell: bash
      run: |
        mkdir -p backend/models/torch/hub/checkpoints
        echo "Downloading big-lama.pt model..."
        curl -L -o backend/models/torch/hub/checkpoints/big-lama.pt "https://github.com/Sanster/models/releases/download/add_big_lama/big-lama.pt"

    - name: Build Application
      shell: bash
      run: |
        python scripts/build.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Delogo-Release-${{ matrix.os }}
        path: frontend/release/*
        retention-days: 7

    - name: Publish to GitHub Releases
      if: ${{ github.event.inputs.version_tag != '' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version_tag }}
        name: Release ${{ github.event.inputs.version_tag }}
        files: |
          frontend/release/*.exe
          frontend/release/*.dmg
          frontend/release/*.zip
